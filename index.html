<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming soon</title>
  <meta name="description" content="Something new is on the way.">
  <style>
    :root {
      --bg: #f6f4ef;
      --fg: #1c1b19;
      --muted: #6b675f;
      --accent: #c8553d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --fg: #f1eee8;
        --muted: #9a958b;
        --accent: #e8866f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 36rem; }
    .eyebrow {
      margin: 0 0 1.25rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 9vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }
    .tagline {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.6;
    }
    .contact { margin: 2rem 0 0; font-size: 1rem; }
    .contact a { color: var(--fg); text-underline-offset: 0.2em; }
    .contact a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Coming soon</p>
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="contact" id="contact" hidden></p>
  </main>

  <script>
    // Edit these three lines. Leave NAME empty to show the domain name instead.
    const NAME = "";
    const TAGLINE = "Something new is on the way. Check back soon.";
    const EMAIL = ""; // e.g. "hello@yourdomain.com" — leave empty to hide

    const host = location.hostname.replace(/^www\./, "");
    const name = NAME || host || "Coming soon";
    document.getElementById("name").textContent = name;
    document.getElementById("tagline").textContent = TAGLINE;
    document.title = name;

    if (EMAIL) {
      const contact = document.getElementById("contact");
      const link = document.createElement("a");
      link.href = "mailto:" + EMAIL;
      link.textContent = EMAIL;
      contact.append(link);
      contact.hidden = false;
    }
  </script>
</body>
</html>
